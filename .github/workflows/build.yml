name: build

on:
  push:
    branches: [linux, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet run --project tests/InstallerTests -c Release

      - name: Publish
        run: dotnet publish src/Installer -c Release -r linux-x64 -o publish

      - name: Check the binary is self-contained and runnable
        run: |
          file publish/BigWalkVRInstaller
          test -x publish/BigWalkVRInstaller
          ls -lh publish/BigWalkVRInstaller

      - uses: actions/upload-artifact@v4
        with:
          name: BigWalkVRInstaller-linux-x64
          path: publish/BigWalkVRInstaller
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/BigWalkVRInstaller
          generate_release_notes: true
